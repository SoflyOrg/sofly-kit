# Deploy de SOFLY a un VPS por SSH: `git pull --ff-only` + el script de deploy
# del sistema (el build de las imágenes corre en el VPS). Lo llama el
# `deploy.yml` de cada sistema cuando su CI terminó en verde en main:
#
#   on:
#     workflow_run: { workflows: [CI], types: [completed], branches: [main] }
#   jobs:
#     deploy:
#       if: ${{ github.event.workflow_run.conclusion == 'success' }}
#       uses: SoflyOrg/sofly-kit/.github/workflows/deploy-vps.yml@v1
#       with: { path: ~/reina-reech }
#       secrets:
#         VPS_HOST: ${{ secrets.VPS_HOST }}
#         VPS_USER: ${{ secrets.VPS_USER }}
#         VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
#
# Los secrets van explícitos: `secrets: inherit` no cruza de organización y
# varios sistemas viven en cuentas personales.
#
# Con `detach: true` el job hace el pull, deja el deploy corriendo en el VPS
# y termina en segundos: GitHub cobra cada minuto que el runner espera por SSH
# un build que pasa en el VPS (había deploys de 30 a 45 minutos). El
# resultado queda en el VPS (`~/.deploys/<carpeta>.log` y `.status`) y el job
# siguiente avisa con un ::error:: si el deploy anterior falló.
name: Deploy VPS (sofly-kit)

on:
  workflow_call:
    inputs:
      path:
        description: Carpeta del repo en el VPS (por ejemplo, ~/reina-reech).
        type: string
        required: true
      command:
        description: Lo que corre después del pull.
        type: string
        default: bash scripts/deploy.sh
      timeout:
        description: Un build sin caché (después del prune semanal) pasa los 30 minutos.
        type: string
        default: 60m
      detach:
        description: Deja el deploy corriendo en el VPS y no espera a que termine (ver arriba).
        type: boolean
        default: false
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

# Un deploy a la vez y sin cortar el que está corriendo: un build cortado a la
# mitad deja imágenes a medio hacer.
concurrency:
  group: deploy-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: ${{ inputs.timeout }}
          script: |
            set -e
            cd ${{ inputs.path }}
            if [ "${{ inputs.detach }}" != "true" ]; then
              git pull --ff-only
              ${{ inputs.command }}
              exit 0
            fi
            name="$(basename "$PWD")"
            dir="$HOME/.deploys"
            mkdir -p "$dir"
            # Cómo terminó el deploy anterior (el que soltó el push previo).
            if [ -f "$dir/$name.status" ]; then
              prev="$(cat "$dir/$name.status")"
              echo "Deploy anterior: $prev"
              case "$prev" in
                fail*) echo "::error::El deploy anterior falló. Últimas líneas de $dir/$name.log:"; tail -n 40 "$dir/$name.log" || true ;;
              esac
            fi
            # El pull se hace adentro del candado: si entra un push mientras
            # buildea otro, espera y deploya el main más nuevo.
            log="$dir/$name.log"
            if [ -f "$log" ] && [ "$(wc -c < "$log")" -gt 2000000 ]; then : > "$log"; fi
            nohup setsid flock "$dir/$name.lock" bash -c '
              echo "=== deploy $(date -u +%FT%TZ)"
              echo "running $(date -u +%FT%TZ)" > "$1/$2.status"
              if git pull --ff-only && eval "$3"; then
                echo "ok $(date -u +%FT%TZ) $(git rev-parse --short HEAD)" > "$1/$2.status"
              else
                echo "fail $(date -u +%FT%TZ) $(git rev-parse --short HEAD)" > "$1/$2.status"
              fi
            ' _ "$dir" "$name" "${{ inputs.command }}" >> "$log" 2>&1 < /dev/null &
            echo "Deploy lanzado en el VPS: log en $log"
